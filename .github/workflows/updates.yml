name: theme tracker

on:
  workflow_dispatch:
  schedule:
    - cron: '55 0 * * *'

permissions:
  contents: write
  issues: write

jobs:
  icons:
    name: Check for new and outdated themes
    if: github.repository_owner == 'hideoo'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm, Node.js, and dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true

      - name: Check for updates
        run: pnpm updates

      - name: Find report issue
        if: ${{ hashFiles('updates.md') != '' }}
        id: report-issue
        uses: micalevisk/last-issue-action@v2
        with:
          state: open
          labels: ci

      - name: Create or update report issue
        if: ${{ hashFiles('updates.md') != '' }}
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Theme updates
          content-filepath: updates.md
          issue-number: ${{ steps.report-issue.outputs.issue-number }}
          labels: ci
